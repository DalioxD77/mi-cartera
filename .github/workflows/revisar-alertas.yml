name: Revisar alertas

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  revisar-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar job de alertas
        env:
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run job:alertas

# El estado persistente real necesitará una base de datos en producción; este archivo solo deja preparado el flujo automatizado.
